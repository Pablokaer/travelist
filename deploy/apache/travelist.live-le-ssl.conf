<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName travelist.live
    ServerAlias www.travelist.live
    DocumentRoot /var/www/travelist

    <Directory /var/www/travelist>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Agents (D-081): public pages and the 404 come as HTML or Markdown. scripts/agent-pages.mjs
    # writes <page>.md and a type map <page>.var; mod_negotiation (on by default in Ubuntu) picks
    # by the Accept header's q-values, adds Vary: Accept, and answers 406 when neither is wanted.
    AddType "text/markdown; charset=utf-8" .md
    AddCharset utf-8 .txt
    AddHandler type-map .var

    # Self-hosted Supabase (D-082): the API answers on the site's own origin, so the app's
    # EXPO_PUBLIC_SUPABASE_URL is https://travelist.live. Envoy (the stack's gateway) listens on
    # 127.0.0.1:18000 only (deploy/supabase/docker-compose.travelist.yml); Realtime is a WebSocket.
    # The timeout covers the Edge Functions' 150 s request limit.
    ProxyPass        /realtime/v1/ http://127.0.0.1:18000/realtime/v1/ upgrade=websocket timeout=160
    ProxyPassReverse /realtime/v1/ http://127.0.0.1:18000/realtime/v1/
    # nocanon: paths reach Envoy as sent (Storage object names may hold encoded characters).
    ProxyPass        /rest/v1/ http://127.0.0.1:18000/rest/v1/ nocanon timeout=160
    ProxyPass        /auth/v1/ http://127.0.0.1:18000/auth/v1/ nocanon timeout=160
    ProxyPassReverse /auth/v1/ http://127.0.0.1:18000/auth/v1/
    ProxyPass        /storage/v1/ http://127.0.0.1:18000/storage/v1/ nocanon timeout=160
    ProxyPass        /functions/v1/ http://127.0.0.1:18000/functions/v1/ nocanon timeout=160
    ProxyPass        /graphql/v1 http://127.0.0.1:18000/graphql/v1 nocanon timeout=160
    <LocationMatch "^/(rest|auth|storage|functions|realtime|graphql)/v1">
        # Storage and Auth build public URLs from these (Envoy sees plain http from Apache).
        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Forwarded-Host "travelist.live"
    </LocationMatch>

    # Static export: /sign-in -> sign-in.html; dynamic routes -> their [param].html page.
    RewriteEngine On
    # API paths go to the proxy above, never to the static files below.
    RewriteRule ^/(rest|auth|storage|functions|realtime|graphql)/v1(/|$) - [L]
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -f
    RewriteRule ^ - [L]
    RewriteCond %{DOCUMENT_ROOT}/index.var -f
    RewriteRule ^/$ /index.var [L]
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI}.var -f
    RewriteRule ^(.+?)/?$ $1.var [L]
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI}.html -f
    RewriteRule ^(.+?)/?$ $1.html [L]
    RewriteRule ^/city/[^/]+/?$ "/city/[slug].html" [L]
    RewriteRule ^/short/[^/]+/(meetups|walklists)/?$ "/short/[slug]/$1.html" [L]
    RewriteRule ^/short/[^/]+/?$ "/short/[slug].html" [L]
    RewriteRule ^/attraction/[^/]+/?$ "/attraction/[id].html" [L]
    RewriteRule ^/checklist/[^/]+/?$ "/checklist/[city].html" [L]
    RewriteRule ^/trip/[^/]+/?$ "/trip/[id].html" [L]
    # +not-found.html, or 404.md for Accept: text/markdown (404.var), still with status 404.
    ErrorDocument 404 /404.var

    # Hashed JS/CSS never change; HTML and Markdown are always revalidated.
    <LocationMatch "^/_expo/static/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <FilesMatch "\.(html|md|var)$">
        Header set Cache-Control "no-cache"
        # mod_negotiation appends its variant-list validator to a file ETag and drops the closing
        # quote (Apache 2.4.58: ETag: "434-…;81-…); revalidation uses Last-Modified instead.
        FileETag None
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/travelist-error.log
    CustomLog ${APACHE_LOG_DIR}/travelist-access.log combined

Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/travelist.live/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/travelist.live/privkey.pem
</VirtualHost>
</IfModule>
