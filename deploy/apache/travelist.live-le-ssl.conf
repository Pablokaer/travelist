<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName travelist.live
    ServerAlias www.travelist.live
    DocumentRoot /var/www/travelist

    <Directory /var/www/travelist>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Agents (D-081): public pages and the 404 come as HTML or Markdown. scripts/agent-pages.mjs
    # writes <page>.md and a type map <page>.var; mod_negotiation (on by default in Ubuntu) picks
    # by the Accept header's q-values, adds Vary: Accept, and answers 406 when neither is wanted.
    AddType "text/markdown; charset=utf-8" .md
    AddCharset utf-8 .txt
    AddHandler type-map .var

    # Static export: /sign-in -> sign-in.html; dynamic routes -> their [param].html page.
    RewriteEngine On
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -f
    RewriteRule ^ - [L]
    RewriteCond %{DOCUMENT_ROOT}/index.var -f
    RewriteRule ^/$ /index.var [L]
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI}.var -f
    RewriteRule ^(.+?)/?$ $1.var [L]
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI}.html -f
    RewriteRule ^(.+?)/?$ $1.html [L]
    RewriteRule ^/city/[^/]+/?$ "/city/[slug].html" [L]
    RewriteRule ^/short/[^/]+/(meetups|walklists)/?$ "/short/[slug]/$1.html" [L]
    RewriteRule ^/short/[^/]+/?$ "/short/[slug].html" [L]
    RewriteRule ^/attraction/[^/]+/?$ "/attraction/[id].html" [L]
    RewriteRule ^/checklist/[^/]+/?$ "/checklist/[city].html" [L]
    RewriteRule ^/trip/[^/]+/?$ "/trip/[id].html" [L]
    # +not-found.html, or 404.md for Accept: text/markdown (404.var), still with status 404.
    ErrorDocument 404 /404.var

    # Hashed JS/CSS never change; HTML and Markdown are always revalidated.
    <LocationMatch "^/_expo/static/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <FilesMatch "\.(html|md|var)$">
        Header set Cache-Control "no-cache"
        # mod_negotiation appends its variant-list validator to a file ETag and drops the closing
        # quote (Apache 2.4.58: ETag: "434-…;81-…); revalidation uses Last-Modified instead.
        FileETag None
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/travelist-error.log
    CustomLog ${APACHE_LOG_DIR}/travelist-access.log combined

Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/travelist.live/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/travelist.live/privkey.pem
</VirtualHost>
</IfModule>
