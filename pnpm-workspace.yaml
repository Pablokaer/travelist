packages:
  - 'apps/*'
  - 'packages/*'

# React Native libraries (MapLibre, Reanimated, etc.) are most reliable with a flat
# node_modules layout. See docs/DECISIONS.md (D-003).
nodeLinker: hoisted

onlyBuiltDependencies:
  - esbuild
  - supabase
  - unrs-resolver

ignoredBuiltDependencies:
  - '@parcel/watcher'

# Patched versions forced where a vulnerable one only arrives through a dependency's dependency.
# Drop an entry once the parent ships the fix itself.
overrides:
  # GHSA-pqg4-j6r4-53mv (critical): quote() command injection, via react-native >
  # react-devtools-core (dev tools only); fixed in 1.11.0.
  shell-quote: ^1.11.0
  # GHSA-68fv-2mgg-jv7q (high): event-loop DoS from indexed source-map offsets, via
  # @expo/metro-config > postcss (build only); fixed in 1.2.2.
  source-map-js: ^1.2.2
  # GHSA-7wch-p9px-956x, -jc66-7q78-782g, -8hrf-8g6f-7xwp, -hqq3-7jhf-c5jx, -5x38-2vff-x55p (high,
  # published 2026-11): PEM/PKCS#12/ASN.1 flaws, via expo > @expo/cli (dev server only), which
  # asks for ^1.3.3; fixed in 1.4.1.
  node-forge: ^1.4.1

# Advisories with no fixed version that only reach dev tooling (not the app bundle).
# Review on every Expo upgrade and drop an entry once a patch exists (D-049).
auditConfig:
  ignoreGhsas:
    # node-forge RSA signature check, via expo > @expo/cli (dev server only); no patched version.
    - GHSA-86w9-cpqp-85rv
    # braces stack exhaustion on deeply nested patterns (published 2026-09-18), via jest, metro and
    # @expo/cli (dev and build tools only; patterns come from our own config); no patched version.
    - GHSA-vfj7-8cjw-p6xm
    # zod memory exhaustion on oversized constrained collections (published 2026-10), via
    # expo > @expo/cli, which pins zod ^3.25.76 (CLI and dev server only, not the app bundle); the
    # fix is only in zod >= 4.6.6, which the app and shared package use directly.
    - GHSA-mrhx-c7xc-m3w5
    # Exception to the rule above: this one reaches the web bundle. decode-uri-component quadratic
    # replacement of percent-encoded runs (published 2026-11), via expo-router > query-string@7,
    # which require()s it as a CommonJS function; the only fix, 0.5.1, is ESM-only, so an override
    # breaks URL parsing. Impact: a crafted link can freeze the tab of whoever opens it (no data
    # exposure). Drop once expo-router moves to a query-string that takes the fixed version.
    - GHSA-qr28-fpjm-wq7f
