# Launch cities for Wayfarer.
#
# Adding a city is a config-only change: add an entry here, then run
#   python -m wayfarer_pipeline ingest --city <slug>
#
# Field reference
#   slug            url-safe id, unique, used by the CLI (--city <slug>)
#   name.en/pt      display names (Wikidata labels)
#   country_code    ISO-3166-1 alpha-2
#   wikidata_id     city item on Wikidata
#   osm_relation_id OSM administrative boundary relation (null if not usable)
#   center          [lat, lon] (Wikidata P625)
#   bbox            [south, west, north, east] used for ingestion queries (Nominatim)
#   timezone        IANA time zone (tzdb)
#   is_active       inactive cities are ingested but hidden from the map
#
# Sources: Wikidata SPARQL + Nominatim, retrieved 2026-09-26. See docs/DATA_SOURCES.md.

version: 1

cities:
  - slug: london
    name: { en: London, pt: Londres }
    country_code: GB
    wikidata_id: Q84
    osm_relation_id: 175342 # Greater London
    center: [51.507222, -0.1275]
    bbox: [51.2867601, -0.5103751, 51.6918741, 0.3340155]
    timezone: Europe/London
    is_active: true

  - slug: paris
    name: { en: Paris, pt: Paris }
    country_code: FR
